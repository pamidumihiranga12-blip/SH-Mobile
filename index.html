<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SH Mobile Padaviya - ERP</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{--p:#0d6efd;--d:#0f172a;--g:#16a34a;--r:#dc2626;--o:#f59e0b;--bg:#f1f5f9}
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Arial,sans-serif}
body{background:var(--bg);color:#1e293b;font-size:14px}
.app{display:flex;min-height:100vh}
.side{width:220px;background:var(--d);color:#cbd5e1;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;overflow:auto;z-index:20;transition:.2s}
.side .logo{padding:16px;border-bottom:1px solid #1e293b;color:#fff}
.side .logo b{font-size:16px;display:block}.side .logo small{color:#94a3b8}
.side a{padding:11px 18px;cursor:pointer;display:block;border-left:3px solid transparent}
.side a:hover{background:#1e293b}.side a.on{background:#1e293b;color:#fff;border-left-color:var(--p)}
.side .by{margin-top:auto;padding:12px;font-size:11px;color:#64748b;text-align:center}
.main{margin-left:220px;flex:1;padding:18px;min-width:0}
.top{display:none;background:var(--d);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:15}
h2{margin-bottom:14px}h3{margin-bottom:10px}
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px #0001;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border-radius:10px;padding:14px;border-left:4px solid var(--p);box-shadow:0 1px 3px #0001}
.stat small{color:#64748b}.stat b{display:block;font-size:20px;margin-top:4px}
.stat.g{border-color:var(--g)}.stat.r{border-color:var(--r)}.stat.o{border-color:var(--o)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #e2e8f0;vertical-align:middle}
th{background:#f8fafc;font-size:12px;text-transform:uppercase;color:#64748b}
.tw{overflow-x:auto}
.btn{background:var(--p);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{opacity:.88}.btn.g{background:var(--g)}.btn.r{background:var(--r)}.btn.o{background:var(--o)}.btn.x{background:#64748b}
.btn.sm{padding:4px 9px;font-size:12px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #93c5fd}
label{display:block;font-size:12px;font-weight:600;color:#475569}
label input,label select,label textarea{margin-top:3px;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{width:auto;min-width:180px}
.badge{padding:3px 9px;border-radius:20px;font-size:11px;color:#fff;display:inline-block;white-space:nowrap}
.b-g{background:var(--g)}.b-r{background:var(--r)}.b-o{background:var(--o)}.b-p{background:var(--p)}.b-x{background:#64748b}
.pos{display:grid;grid-template-columns:1fr 1.3fr;gap:14px}
.big{font-size:17px;padding:12px}
.pitem{padding:9px;border:1px solid #e2e8f0;border-radius:6px;margin-top:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.pitem:hover{background:#eff6ff}
.tot{display:flex;justify-content:space-between;padding:4px 0}
.tot.big2{font-size:20px;font-weight:700;border-top:2px solid #e2e8f0;margin-top:6px;padding-top:8px}
.cartin{width:70px;padding:4px}
#modalWrap{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 10px}
#modalWrap.show{display:flex}
#modalBox{background:#fff;border-radius:10px;width:100%;max-width:640px}
.mh{padding:14px 18px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;font-size:16px}
.mb{padding:18px}.x{cursor:pointer;color:#64748b}
.toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:12px 18px;border-radius:8px;z-index:99}
#lock{position:fixed;inset:0;background:var(--d);display:none;align-items:center;justify-content:center;z-index:100}
#lock>div{background:#fff;padding:30px;border-radius:12px;text-align:center;width:300px}
.lbl{display:inline-block;border:1px dashed #94a3b8;margin:3px;padding:2px 3px;text-align:center;overflow:hidden;vertical-align:top;background:#fff;color:#000}
.lbl .ln{font-size:7pt;font-weight:700}.lbl .lp{font-size:7pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl .lpr{font-size:9pt;font-weight:700}.lbl svg{max-width:100%;height:auto}
.labels.roll .lbl{display:block;margin:0;border:0;page-break-after:always}
.rc{width:72mm;font-family:monospace;font-size:12px;color:#000;margin:auto}
.rc .c{text-align:center}.rc hr{border:0;border-top:1px dashed #000;margin:6px 0}
.rc table td,.rc table th{border:0;padding:1px 0;background:none;color:#000;font-size:12px;text-transform:none}
#printArea{display:none}
@media print{.app,#modalWrap,#lock,.toast,.top{display:none!important}#printArea{display:block}body{background:#fff}@page{margin:4mm}.lbl{border:0}}
@media(max-width:850px){.side{left:-230px}.side.open{left:0}.main{margin-left:0;padding:10px}.top{display:flex;justify-content:space-between}.pos,.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="lock"><div><h3>🔒 SH Mobile Padaviya</h3><p style="margin:10px 0">Enter PIN</p><input id="pinIn" type="password" style="text-align:center;font-size:20px" onkeydown="if(event.key==='Enter')unlock()"><br><br><button class="btn" onclick="unlock()">Unlock</button></div></div>

<div class="top"><b>SH Mobile Padaviya</b><span onclick="document.querySelector('.side').classList.toggle('open')" style="cursor:pointer;font-size:20px">☰</span></div>
<div class="app">
  <div class="side">
    <div class="logo"><b>📱 SH Mobile</b><small>Padaviya · 078-533-6459</small></div>
    <a data-p="dashboard">📊 Dashboard</a>
    <a data-p="pos">🛒 New Sale (POS)</a>
    <a data-p="sales">🧾 Sales History</a>
    <a data-p="products">📦 Products / Stock</a>
    <a data-p="repairs">🔧 Repairs</a>
    <a data-p="warranty">🛡️ Warranty Check</a>
    <a data-p="barcode">🏷️ Barcode Print</a>
    <a data-p="customers">👥 Customers</a>
    <a data-p="expenses">💸 Expenses</a>
    <a data-p="reports">📈 Profit Reports</a>
    <a data-p="settings">⚙️ Settings / Backup</a>
    <div class="by">Designed & Developed by<br><b style="color:#94a3b8">SMARTZONE LK</b></div>
  </div>
  <div class="main" id="main"></div>
</div>
<div id="modalWrap"><div id="modalBox"></div></div>
<div id="printArea"></div>

<script>
/* ============ DATA ============ */
const KEY='shm_erp_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{products:[],sales:[],repairs:[],expenses:[],
 settings:{name:'SH Mobile Padaviya',phone:'078-533-6459',address:'Padaviya',pin:'',low:3,footer:'Thank you! Come again.'},cnt:{sale:1000,repair:500}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const now=()=>{const d=new Date();return today()+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=n=>'Rs. '+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((x,y)=>x+(+f(y)||0),0);
const v=id=>$('#'+id).value.trim();
const n=id=>parseFloat($('#'+id).value)||0;
function addMonths(ds,m){const d=new Date(ds.slice(0,10)+'T00:00:00');d.setMonth(d.getMonth()+m);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function addDays(ds,k){const d=new Date(ds.slice(0,10)+'T00:00:00');d.setDate(d.getDate()+k);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function daysLeft(end){return Math.ceil((new Date(end+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5)}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function modal(title,body){$('#modalBox').innerHTML=`<div class="mh"><b>${title}</b><span class="x" onclick="closeModal()">✕</span></div><div class="mb">${body}</div>`;$('#modalWrap').classList.add('show')}
function closeModal(){$('#modalWrap').classList.remove('show')}
function genCode(){let c;do{c='SH'+String(Date.now()).slice(-7)+Math.floor(Math.random()*10)}while(db.products.some(p=>p.code===c));return c}
function printHTML(h){$('#printArea').innerHTML=h;drawBC($('#printArea'));setTimeout(()=>window.print(),250)}
function drawBC(root){root.querySelectorAll('svg.bc').forEach(s=>{try{JsBarcode(s,s.dataset.c,{format:'CODE128',width:1.5,height:30,fontSize:10,margin:0,textMargin:1})}catch(e){}})}
function badge(t){const m={'Received':'b-x','In Progress':'b-o','Waiting Parts':'b-p','Completed':'b-g','Delivered':'b-g','Cancelled':'b-r'};return `<span class="badge ${m[t]||'b-x'}">${t}</span>`}

/* ============ NAV ============ */
let cur='dashboard';
const pages={},init={};
function go(p){cur=p;document.querySelectorAll('.side a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));
 $('#main').innerHTML=pages[p]();(init[p]||(()=>{}))();document.querySelector('.side').classList.remove('open');window.scrollTo(0,0)}
document.querySelectorAll('.side a').forEach(a=>a.onclick=()=>go(a.dataset.p));

/* ============ CALC ============ */
function calc(f,t){const inR=d=>d>=f&&d<=t;
 const S=db.sales.filter(s=>inR(s.date.slice(0,10)));
 const R=db.repairs.filter(r=>r.status==='Delivered'&&inR((r.deliveredDate||r.date).slice(0,10)));
 const E=db.expenses.filter(e=>inR(e.date));
 const o={S,R,E};o.sales=sum(S,s=>s.total);o.saleProfit=sum(S,s=>s.profit);o.saleCost=o.sales-o.saleProfit;
 o.repInc=sum(R,r=>r.charge);o.repCost=sum(R,r=>r.partsCost);o.repProfit=o.repInc-o.repCost;
 o.exp=sum(E,e=>e.amount);o.net=o.saleProfit+o.repProfit-o.exp;return o}

/* ============ DASHBOARD ============ */
pages.dashboard=()=>{const t=today(),m=t.slice(0,7);const a=calc(t,t),b=calc(m+'-01',m+'-31');
 const low=db.products.filter(p=>p.stock<=db.settings.low);
 const pend=db.repairs.filter(r=>!['Delivered','Cancelled'].includes(r.status));
 const stockVal=sum(db.products,p=>p.cost*p.stock);
 return `<h2>Welcome to ${esc(db.settings.name)} 👋</h2>
 <div class="stats">
 <div class="stat g"><small>Today Sales</small><b>${fmt(a.sales)}</b></div>
 <div class="stat g"><small>Today Profit (Sales+Repair)</small><b>${fmt(a.saleProfit+a.repProfit)}</b></div>
 <div class="stat o"><small>Pending Repairs</small><b>${pend.length}</b></div>
 <div class="stat r"><small>Low Stock Items</small><b>${low.length}</b></div>
 <div class="stat"><small>This Month Sales</small><b>${fmt(b.sales)}</b></div>
 <div class="stat g"><small>This Month Net Profit</small><b>${fmt(b.net)}</b></div>
 <div class="stat"><small>Stock Value (Cost)</small><b>${fmt(stockVal)}</b></div>
 <div class="stat"><small>Total Products</small><b>${db.products.length}</b></div></div>
 <div class="row" style="margin-bottom:14px"><button class="btn g" onclick="go('pos')">🛒 New Sale</button><button class="btn o" onclick="repairForm()">🔧 New Repair</button><button class="btn" onclick="productForm()">📦 Add Product</button><button class="btn x" onclick="go('warranty')">🛡️ Warranty Check</button></div>
 <div class="pos"><div class="card"><h3>⚠️ Low Stock</h3><div class="tw"><table><tr><th>Product</th><th>Stock</th></tr>${low.slice(0,10).map(p=>`<tr><td>${esc(p.name)}</td><td><span class="badge b-r">${p.stock}</span></td></tr>`).join('')||'<tr><td colspan=2>All good ✅</td></tr>'}</table></div></div>
 <div class="card"><h3>🔧 Pending Repairs</h3><div class="tw"><table><tr><th>No</th><th>Device</th><th>Status</th></tr>${pend.slice(0,10).map(r=>`<tr><td>${r.no}</td><td>${esc(r.device)}<br><small>${esc(r.customer)}</small></td><td>${badge(r.status)}</td></tr>`).join('')||'<tr><td colspan=3>No pending repairs</td></tr>'}</table></div></div></div>`};

/* ============ PRODUCTS ============ */
const CATS=['Mobile Phone','Used Phone','Charger','Cable','Earphone/Handsfree','Battery','Back Cover','Tempered Glass','Power Bank','Memory Card','Spare Part','Other'];
pages.products=()=>`<h2>📦 Products / Stock</h2><div class="bar"><input id="psearch" placeholder="Search name / barcode / category..." oninput="drawProducts()"><button class="btn" onclick="productForm()">+ Add Product</button><button class="btn x" onclick="go('barcode')">🏷️ Print Barcodes</button></div><div class="card tw" id="ptable"></div>`;
init.products=()=>drawProducts();
function drawProducts(){const q=(v('psearch')||'').toLowerCase();
 const L=db.products.filter(p=>(p.name+p.code+p.category).toLowerCase().includes(q));
 $('#ptable').innerHTML=`<table><tr><th>Barcode</th><th>Name</th><th>Category</th><th>Cost</th><th>Price</th><th>Profit</th><th>Stock</th><th>Warranty</th><th></th></tr>`+
 L.map(p=>`<tr><td>${esc(p.code)}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.category)}</td><td>${fmt(p.cost)}</td><td>${fmt(p.price)}</td><td>${fmt(p.price-p.cost)}</td>
 <td><span class="badge ${p.stock<=db.settings.low?'b-r':'b-g'}">${p.stock}</span></td><td>${p.warranty?p.warranty+' m':'-'}</td>
 <td style="white-space:nowrap"><button class="btn sm" onclick="productForm('${p.id}')">Edit</button> <button class="btn sm o" onclick="quickLabel('${p.id}')">🏷️</button> <button class="btn sm r" onclick="delProduct('${p.id}')">🗑</button></td></tr>`).join('')+
 (L.length?'':'<tr><td colspan=9>No products. Click "+ Add Product".</td></tr>')+'</table>'}
function productForm(id){const p=db.products.find(x=>x.id===id)||{};
 modal(id?'Edit Product':'Add Product',`<div class="grid2">
 <label>Product Name *<input id="f_name" value="${esc(p.name)}"></label>
 <label>Category<input id="f_cat" list="cats" value="${esc(p.category||'')}"><datalist id="cats">${CATS.map(c=>`<option>${c}</option>`).join('')}</datalist></label>
 <label>Barcode<div class="row" style="flex-wrap:nowrap"><input id="f_code" value="${esc(p.code||genCode())}"><button class="btn sm" onclick="$('#f_code').value=genCode()">Auto</button></div></label>
 <label>Stock Qty<input id="f_stock" type="number" value="${p.stock??0}"></label>
 <label>Cost Price (Rs)<input id="f_cost" type="number" value="${p.cost??''}"></label>
 <label>Selling Price (Rs)<input id="f_price" type="number" value="${p.price??''}"></label>
 <label>Warranty (months, 0 = none)<input id="f_war" type="number" value="${p.warranty??0}"></label></div><br>
 <button class="btn g" onclick="saveProduct('${id||''}')">💾 Save</button>`)}
function saveProduct(id){const o={name:v('f_name'),category:v('f_cat'),code:v('f_code'),stock:parseInt(v('f_stock'))||0,cost:n('f_cost'),price:n('f_price'),warranty:parseInt(v('f_war'))||0};
 if(!o.name||!o.code)return alert('Name and barcode required');
 if(db.products.some(p=>p.code===o.code&&p.id!==id))return alert('Barcode already used!');
 if(id)Object.assign(db.products.find(p=>p.id===id),o);else db.products.push({id:uid(),...o});
 save();closeModal();toast('Saved ✅');go('products')}
function delProduct(id){if(confirm('Delete this product?')){db.products=db.products.filter(p=>p.id!==id);save();drawProducts()}}
function quickLabel(id){go('barcode');$('#bc_prod').value=id;bcPreview()}

/* ============ BARCODE ============ */
function labelsHTML(list,o){return `<div class="labels ${o.roll?'roll':''}">`+list.map(l=>`<div class="lbl" style="width:${o.w}mm;height:${o.h}mm"><div class="ln">${esc(db.settings.name)}</div><div class="lp">${esc(l.name)}</div><svg class="bc" data-c="${esc(l.code)}"></svg>${o.price&&l.price!=null?`<div class="lpr">${fmt(l.price)}</div>`:''}</div>`).join('')+'</div>'}
pages.barcode=()=>`<h2>🏷️ Barcode Generator & Printer</h2><div class="card"><div class="grid3">
 <label>Select Product<select id="bc_prod" onchange="bcPreview()"><option value="">-- Custom text --</option>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.code)})</option>`).join('')}</select></label>
 <label>Custom Barcode Text<input id="bc_text" placeholder="e.g. 123456789" oninput="bcPreview()"></label>
 <label>Number of Labels<input id="bc_qty" type="number" value="1" min="1" oninput="bcPreview()"></label>
 <label>Label Width (mm)<input id="bc_w" type="number" value="50" oninput="bcPreview()"></label>
 <label>Label Height (mm)<input id="bc_h" type="number" value="25" oninput="bcPreview()"></label>
 <label>Options<select id="bc_opt" onchange="bcPreview()"><option value="1">Show price</option><option value="0">Hide price</option></select></label></div><br>
 <div class="row"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="bc_roll" style="width:auto" onchange="bcPreview()"> Label roll printer (1 label per page)</label></div><br>
 <div class="row"><button class="btn g" onclick="bcPrint()">🖨️ Print Labels</button><button class="btn o" onclick="bcAll()">🖨️ Print 1 label for ALL products</button><button class="btn x" onclick="bcStock()">🖨️ Print by stock qty (all)</button></div></div>
 <div class="card"><h3>Preview</h3><div id="bcPrev"></div></div>`;
function bcItems(){const id=$('#bc_prod').value;const q=Math.max(1,parseInt(v('bc_qty'))||1);let b;
 if(id){const p=db.products.find(x=>x.id===id);b={code:p.code,name:p.name,price:p.price}}else if(v('bc_text'))b={code:v('bc_text'),name:'',price:null};else return [];
 return Array(Math.min(q,500)).fill(b)}
function bcOpt(){return{w:n('bc_w')||50,h:n('bc_h')||25,price:v('bc_opt')==='1',roll:$('#bc_roll').checked}}
function bcPreview(){const L=bcItems().slice(0,12);$('#bcPrev').innerHTML=L.length?labelsHTML(L,bcOpt()):'<p>Select a product or type text.</p>';drawBC($('#bcPrev'))}
function bcPrint(){const L=bcItems();if(!L.length)return alert('Select product or enter text');printHTML(labelsHTML(L,bcOpt()))}
function bcAll(){if(!db.products.length)return;printHTML(labelsHTML(db.products.map(p=>({code:p.code,name:p.name,price:p.price})),bcOpt()))}
function bcStock(){let L=[];db.products.forEach(p=>{for(let i=0;i<Math.min(p.stock,100);i++)L.push({code:p.code,name:p.name,price:p.price})});if(!L.length)return alert('No stock');printHTML(labelsHTML(L,bcOpt()))}
init.barcode=()=>bcPreview();

/* ============ POS ============ */
let cart=[],ps={cust:'',phone:'',disc:0,method:'Cash',paid:''};
pages.pos=()=>`<h2>🛒 New Sale</h2><div class="pos"><div class="card"><h3>Scan / Search Product</h3><input id="pq" class="big" placeholder="Scan barcode or type name..." onkeydown="if(event.key==='Enter')posEnter()" oninput="posList()"><div id="plist"></div></div><div class="card" id="cartBox"></div></div>`;
init.pos=()=>{posList();drawCart();$('#pq').focus()};
function posList(){const q=v('pq').toLowerCase();const L=db.products.filter(p=>(p.name+p.code+p.category).toLowerCase().includes(q)).slice(0,25);
 $('#plist').innerHTML=L.map(p=>`<div class="pitem" onclick="addCart('${p.id}')"><span><b>${esc(p.name)}</b><br><small>${esc(p.code)} · Stock: ${p.stock}</small></span><b>${fmt(p.price)}</b></div>`).join('')||'<p style="margin-top:10px">No products found</p>'}
function posEnter(){const q=v('pq');const p=db.products.find(x=>x.code===q);if(p){addCart(p.id);$('#pq').value='';posList()}else{const L=db.products.filter(x=>(x.name+x.code).toLowerCase().includes(q.toLowerCase()));if(L.length===1){addCart(L[0].id);$('#pq').value='';posList()}}}
function addCart(pid){const p=db.products.find(x=>x.id===pid);const c=cart.find(x=>x.pid===pid);
 if(c){if(c.qty+1>p.stock)return alert('Not enough stock!');c.qty++}else{if(p.stock<1)return alert('Out of stock!');cart.push({pid,name:p.name,code:p.code,qty:1,price:p.price,cost:p.cost,wm:p.warranty,imei:''})}
 drawCart();$('#pq').focus()}
function cq(i,d){const c=cart[i],p=db.products.find(x=>x.id===c.pid);const q=c.qty+d;if(q<1)return;if(q>p.stock)return alert('Not enough stock!');c.qty=q;drawCart()}
function drawCart(){const sub=sum(cart,c=>c.qty*c.price),tot=Math.max(0,sub-ps.disc),paid=ps.paid===''?tot:+ps.paid;
 $('#cartBox').innerHTML=`<h3>Cart</h3><div class="tw"><table><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr>`+
 cart.map((c,i)=>`<tr><td><b>${esc(c.name)}</b>${c.wm?` <span class="badge b-g">${c.wm}m warranty</span>`:''}<br><input placeholder="IMEI / Serial (optional)" value="${esc(c.imei)}" oninput="cart[${i}].imei=this.value" style="margin-top:4px;padding:4px;font-size:12px"></td>
 <td style="white-space:nowrap"><button class="btn sm x" onclick="cq(${i},-1)">-</button> ${c.qty} <button class="btn sm x" onclick="cq(${i},1)">+</button></td>
 <td><input class="cartin" type="number" value="${c.price}" onchange="cart[${i}].price=+this.value;drawCart()"></td><td>${fmt(c.qty*c.price)}</td><td><button class="btn sm r" onclick="cart.splice(${i},1);drawCart()">✕</button></td></tr>`).join('')+
 (cart.length?'':'<tr><td colspan=5>Cart is empty</td></tr>')+`</table></div><br>
 <div class="grid2"><label>Customer Name<input value="${esc(ps.cust)}" oninput="ps.cust=this.value"></label><label>Phone<input value="${esc(ps.phone)}" oninput="ps.phone=this.value"></label>
 <label>Discount (Rs)<input type="number" value="${ps.disc||''}" onchange="ps.disc=+this.value||0;drawCart()"></label>
 <label>Payment<select onchange="ps.method=this.value">${['Cash','Card','Bank Transfer','Credit'].map(m=>`<option ${ps.method===m?'selected':''}>${m}</option>`).join('')}</select></label></div><br>
 <div class="tot"><span>Subtotal</span><span>${fmt(sub)}</span></div><div class="tot"><span>Discount</span><span>- ${fmt(ps.disc)}</span></div>
 <div class="tot big2"><span>TOTAL</span><span>${fmt(tot)}</span></div>
 <label style="margin-top:8px">Paid Amount (blank = full)<input type="number" value="${ps.paid}" onchange="ps.paid=this.value;drawCart()"></label>
 <div class="tot"><span>${paid>tot?'Change':'Balance Due'}</span><b>${fmt(Math.abs(tot-paid))}</b></div><br>
 <div class="row"><button class="btn g big" style="flex:1" onclick="checkout()">✅ Complete & Print</button><button class="btn x" onclick="cart=[];ps={cust:'',phone:'',disc:0,method:'Cash',paid:''};drawCart()">Clear</button></div>`}
function checkout(){if(!cart.length)return alert('Cart empty');
 for(const c of cart){const p=db.products.find(x=>x.id===c.pid);if(!p||p.stock<c.qty)return alert('Not enough stock: '+c.name)}
 const sub=sum(cart,c=>c.qty*c.price),tot=Math.max(0,sub-ps.disc),paid=ps.paid===''?tot:Math.min(+ps.paid,tot);
 const profit=sum(cart,c=>(c.price-c.cost)*c.qty)-ps.disc;
 const s={id:uid(),no:'INV-'+(++db.cnt.sale),date:now(),customer:ps.cust||'Walk-in',phone:ps.phone,items:cart.map(c=>({...c})),sub,discount:ps.disc,total:tot,paid,method:ps.method,profit};
 cart.forEach(c=>db.products.find(x=>x.id===c.pid).stock-=c.qty);
 db.sales.unshift(s);save();cart=[];ps={cust:'',phone:'',disc:0,method:'Cash',paid:''};drawCart();posList();toast('Sale completed ✅ '+s.no);printHTML(receiptHTML(s))}
function receiptHTML(s){const st=db.settings;return `<div class="rc"><div class="c"><b style="font-size:16px">${esc(st.name)}</b><br>${esc(st.address)}<br>Tel: ${esc(st.phone)}</div><hr>
 Invoice: <b>${s.no}</b><br>Date: ${s.date}<br>Customer: ${esc(s.customer)} ${esc(s.phone)}<hr>
 <table>${s.items.map(i=>`<tr><td colspan=2><b>${esc(i.name)}</b></td></tr><tr><td>${i.qty} x ${(+i.price).toFixed(2)}</td><td style="text-align:right">${(i.qty*i.price).toFixed(2)}</td></tr>${i.imei?`<tr><td colspan=2>IMEI: ${esc(i.imei)}</td></tr>`:''}${i.wm?`<tr><td colspan=2>Warranty till: ${addMonths(s.date,i.wm)}</td></tr>`:''}`).join('')}</table><hr>
 <table><tr><td>Subtotal</td><td style="text-align:right">${s.sub.toFixed(2)}</td></tr><tr><td>Discount</td><td style="text-align:right">${s.discount.toFixed(2)}</td></tr>
 <tr><td><b>TOTAL</b></td><td style="text-align:right"><b>${s.total.toFixed(2)}</b></td></tr><tr><td>Paid (${s.method})</td><td style="text-align:right">${s.paid.toFixed(2)}</td></tr>
 ${s.paid<s.total?`<tr><td>Balance Due</td><td style="text-align:right">${(s.total-s.paid).toFixed(2)}</td></tr>`:''}</table><hr>
 <div class="c">${esc(st.footer)}<br><small>Warranty void if seal broken / physical or water damage. Keep this bill for warranty.</small><br><small>System by SMARTZONE LK</small></div></div>`}

let sf={f:today(),t:today()};
pages.sales=()=>`<h2>🧾 Sales History</h2><div class="bar">From <input type="date" id="sf" value="${sf.f}" onchange="sf.f=this.value;drawSales()"> To <input type="date" id="st" value="${sf.t}" onchange="sf.t=this.value;drawSales()"><input id="sq" placeholder="Search invoice / customer / phone" oninput="drawSales()"></div><div class="card tw" id="stable"></div>`;
init.sales=()=>drawSales();
function drawSales(){const q=(v('sq')||'').toLowerCase();const L=db.sales.filter(s=>{const d=s.date.slice(0,10);return d>=sf.f&&d<=sf.t&&(s.no+s.customer+s.phone).toLowerCase().includes(q)});
 $('#stable').innerHTML=`<table><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Profit</th><th>Pay</th><th></th></tr>`+L.map(s=>`<tr><td><b>${s.no}</b></td><td>${s.date}</td><td>${esc(s.customer)}<br><small>${esc(s.phone)}</small></td><td>${s.items.map(i=>esc(i.name)+' x'+i.qty).join(', ')}</td><td>${fmt(s.total)}${s.paid<s.total?`<br><span class="badge b-r">Due ${fmt(s.total-s.paid)}</span>`:''}</td><td>${fmt(s.profit)}</td><td>${s.method}</td>
 <td style="white-space:nowrap"><button class="btn sm" onclick="printHTML(receiptHTML(db.sales.find(x=>x.id==='${s.id}')))">🖨️</button> ${s.paid<s.total?`<button class="btn sm g" onclick="payDue('${s.id}')">Pay</button>`:''} <button class="btn sm r" onclick="delSale('${s.id}')">🗑</button></td></tr>`).join('')+(L.length?'':'<tr><td colspan=8>No sales</td></tr>')+`</table><br><b>Total: ${fmt(sum(L,s=>s.total))} | Profit: ${fmt(sum(L,s=>s.profit))}</b>`}
function payDue(id){const s=db.sales.find(x=>x.id===id);const a=parseFloat(prompt('Due: '+(s.total-s.paid)+'\nEnter amount received:'));if(a>0){s.paid=Math.min(s.total,s.paid+a);save();drawSales()}}
function delSale(id){if(!confirm('Delete sale? Stock will be returned.'))return;const s=db.sales.find(x=>x.id===id);s.items.forEach(i=>{const p=db.products.find(x=>x.id===i.pid);if(p)p.stock+=i.qty});db.sales=db.sales.filter(x=>x.id!==id);save();drawSales()}

/* ============ REPAIRS ============ */
const RS=['Received','In Progress','Waiting Parts','Completed','Delivered','Cancelled'];let rfilter='All';
pages.repairs=()=>`<h2>🔧 Repairs</h2><div class="bar"><button class="btn o" onclick="repairForm()">+ New Repair Job</button><select id="rsel" onchange="rfilter=this.value;drawRepairs()"><option>All</option>${RS.map(s=>`<option ${rfilter===s?'selected':''}>${s}</option>`).join('')}</select><input id="rq" placeholder="Search no / customer / phone / IMEI" oninput="drawRepairs()"></div><div class="card tw" id="rtable"></div>`;
init.repairs=()=>drawRepairs();
function drawRepairs(){const q=(v('rq')||'').toLowerCase();const L=db.repairs.filter(r=>(rfilter==='All'||r.status===rfilter)&&(r.no+r.customer+r.phone+r.imei+r.device).toLowerCase().includes(q));
 $('#rtable').innerHTML=`<table><tr><th>Job</th><th>Date</th><th>Customer</th><th>Device / Issue</th><th>Charge</th><th>Advance</th><th>Profit</th><th>Status</th><th></th></tr>`+L.map(r=>`<tr><td><b>${r.no}</b></td><td>${r.date}</td><td>${esc(r.customer)}<br><small>${esc(r.phone)}</small></td><td>${esc(r.device)}<br><small>${esc(r.issue)}</small></td><td>${fmt(r.charge||r.estimate)}</td><td>${fmt(r.advance)}</td><td>${fmt((r.charge||0)-r.partsCost)}</td>
 <td><select onchange="setRS('${r.id}',this.value)" style="padding:3px">${RS.map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
 <td style="white-space:nowrap"><button class="btn sm" onclick="repairForm('${r.id}')">Edit</button> <button class="btn sm o" onclick="printRepair('${r.id}')">🖨️</button> <button class="btn sm r" onclick="delRepair('${r.id}')">🗑</button></td></tr>`).join('')+(L.length?'':'<tr><td colspan=9>No repair jobs</td></tr>')+'</table>'}
function setRS(id,s){if(s==='Delivered')return repairForm(id,'Delivered');db.repairs.find(r=>r.id===id).status=s;save();drawRepairs()}
function repairForm(id,st){const r=db.repairs.find(x=>x.id===id)||{};
 modal(id?'Edit Repair '+r.no:'New Repair Job',`<div class="grid2">
 <label>Customer Name *<input id="r_c" value="${esc(r.customer)}"></label><label>Phone *<input id="r_p" value="${esc(r.phone)}"></label>
 <label>Device (Brand/Model) *<input id="r_d" value="${esc(r.device)}"></label><label>IMEI / Serial<input id="r_i" value="${esc(r.imei)}"></label>
 <label>Issue / Problem<textarea id="r_is" rows="2">${esc(r.issue)}</textarea></label><label>Notes / Accessories left<textarea id="r_n" rows="2">${esc(r.notes)}</textarea></label>
 <label>Estimate (Rs)<input id="r_e" type="number" value="${r.estimate??''}"></label><label>Advance Paid (Rs)<input id="r_a" type="number" value="${r.advance??''}"></label>
 <label>Parts Cost (Rs) - your cost<input id="r_pc" type="number" value="${r.partsCost??''}"></label><label>Final Charge (Rs) - customer pays<input id="r_ch" type="number" value="${r.charge??''}"></label>
 <label>Warranty (days)<input id="r_w" type="number" value="${r.warrantyDays??30}"></label>
 <label>Status<select id="r_s">${RS.map(s=>`<option ${(st||r.status||'Received')===s?'selected':''}>${s}</option>`).join('')}</select></label></div><br>
 <button class="btn g" onclick="saveRepair('${id||''}')">💾 Save</button>`)}
function saveRepair(id){const o={customer:v('r_c'),phone:v('r_p'),device:v('r_d'),imei:v('r_i'),issue:v('r_is'),notes:v('r_n'),estimate:n('r_e'),advance:n('r_a'),partsCost:n('r_pc'),charge:n('r_ch'),warrantyDays:parseInt(v('r_w'))||0,status:v('r_s')};
 if(!o.customer||!o.device)return alert('Customer & device required');
 if(o.status==='Delivered'){if(!o.charge)o.charge=o.estimate}
 let r;if(id){r=db.repairs.find(x=>x.id===id);Object.assign(r,o)}else{r={id:uid(),no:'REP-'+(++db.cnt.repair),date:now(),deliveredDate:'',...o};db.repairs.unshift(r)}
 if(r.status==='Delivered'&&!r.deliveredDate)r.deliveredDate=now();if(r.status!=='Delivered')r.deliveredDate='';
 save();closeModal();toast('Saved ✅');go('repairs');if(!id)printRepair(r.id)}
function delRepair(id){if(confirm('Delete repair job?')){db.repairs=db.repairs.filter(r=>r.id!==id);save();drawRepairs()}}
function printRepair(id){const r=db.repairs.find(x=>x.id===id),st=db.settings;const fin=r.status==='Delivered';const amt=r.charge||r.estimate;
 printHTML(`<div class="rc"><div class="c"><b style="font-size:16px">${esc(st.name)}</b><br>Tel: ${esc(st.phone)}<br><b>${fin?'REPAIR BILL':'REPAIR JOB CARD'}</b></div><hr>
 Job No: <b>${r.no}</b><br>Date: ${r.date}<br>Customer: ${esc(r.customer)}<br>Phone: ${esc(r.phone)}<hr>Device: ${esc(r.device)}<br>IMEI: ${esc(r.imei)}<br>Issue: ${esc(r.issue)}<br>Notes: ${esc(r.notes)}<hr>
 <table><tr><td>${fin?'Charge':'Estimate'}</td><td style="text-align:right">${amt.toFixed(2)}</td></tr><tr><td>Advance</td><td style="text-align:right">${r.advance.toFixed(2)}</td></tr><tr><td><b>Balance</b></td><td style="text-align:right"><b>${(amt-r.advance).toFixed(2)}</b></td></tr></table><hr>
 <div class="c">${fin&&r.warrantyDays?`Repair warranty till: ${addDays(r.deliveredDate,r.warrantyDays)}<br>`:''}Bring this slip to collect device.<br><small>Not responsible for items not collected within 30 days.</small><br><small>System by SMARTZONE LK</small></div></div>`)}

/* ============ WARRANTY ============ */
pages.warranty=()=>`<h2>🛡️ Warranty Check</h2><div class="card"><input id="wq" class="big" placeholder="Enter Invoice No / Phone / Customer / IMEI / Barcode / Repair No..." oninput="drawWarranty()"></div><div class="card tw" id="wres"><p>Type to search...</p></div>`;
function drawWarranty(){const q=v('wq').toLowerCase();if(q.length<2){$('#wres').innerHTML='<p>Type at least 2 characters...</p>';return}
 let rows='';db.sales.forEach(s=>{if(!(s.no+s.customer+s.phone).toLowerCase().includes(q)&&!s.items.some(i=>(i.imei+i.code+i.name).toLowerCase().includes(q)))return;
  s.items.forEach(i=>{if(!(s.no+s.customer+s.phone+i.imei+i.code+i.name).toLowerCase().includes(q))return;
   if(!i.wm){rows+=`<tr><td>${s.no}</td><td>${s.date.slice(0,10)}</td><td>${esc(s.customer)}<br><small>${esc(s.phone)}</small></td><td>${esc(i.name)}<br><small>${esc(i.imei)}</small></td><td>-</td><td><span class="badge b-x">No Warranty</span></td></tr>`;return}
   const e=addMonths(s.date,i.wm),d=daysLeft(e);
   rows+=`<tr><td>${s.no}</td><td>${s.date.slice(0,10)}</td><td>${esc(s.customer)}<br><small>${esc(s.phone)}</small></td><td>${esc(i.name)}<br><small>${esc(i.imei)}</small></td><td>${e}</td><td>${d>=0?`<span class="badge b-g">ACTIVE · ${d} days left</span>`:`<span class="badge b-r">EXPIRED · ${-d} days ago</span>`}</td></tr>`})});
 db.repairs.forEach(r=>{if(r.status!=='Delivered'||!(r.no+r.customer+r.phone+r.imei+r.device).toLowerCase().includes(q))return;const e=addDays(r.deliveredDate,r.warrantyDays),d=daysLeft(e);
  rows+=`<tr><td>${r.no}</td><td>${r.deliveredDate.slice(0,10)}</td><td>${esc(r.customer)}<br><small>${esc(r.phone)}</small></td><td>🔧 Repair: ${esc(r.device)}<br><small>${esc(r.imei)}</small></td><td>${e}</td><td>${d>=0?`<span class="badge b-g">ACTIVE · ${d} days left</span>`:`<span class="badge b-r">EXPIRED</span>`}</td></tr>`});
 $('#wres').innerHTML=rows?`<table><tr><th>Ref</th><th>Date</th><th>Customer</th><th>Item</th><th>Warranty End</th><th>Status</th></tr>${rows}</table>`:'<p>No records found.</p>'}

pages.customers=()=>{const m={};const add=(name,ph,k,a)=>{const key=ph||name;if(!key)return;m[key]=m[key]||{name,phone:ph,buy:0,rep:0,spent:0};m[key][k]++;m[key].spent+=a;if(name&&name!=='Walk-in')m[key].name=name};
 db.sales.forEach(s=>{if(s.phone||s.customer!=='Walk-in')add(s.customer,s.phone,'buy',s.total)});db.repairs.forEach(r=>add(r.customer,r.phone,'rep',r.charge||0));
 const L=Object.values(m).sort((a,b)=>b.spent-a.spent);
 return `<h2>👥 Customers</h2><div class="card tw"><table><tr><th>Name</th><th>Phone</th><th>Purchases</th><th>Repairs</th><th>Total Spent</th></tr>${L.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${c.buy}</td><td>${c.rep}</td><td>${fmt(c.spent)}</td></tr>`).join('')||'<tr><td colspan=5>No customers yet</td></tr>'}</table></div>`};

<div class="card tw"><table><tr><th>Date</th><th>Category</th><th>Note</th><th>Amount</th><th></th></tr>${db.expenses.map(e=>`<tr><td>${e.date}</td><td>${esc(e.cat)}</td><td>${esc(e.note)}</td><td>${fmt(e.amount)}</td><td><button class="btn sm r" onclick="delExp('${e.id}')">🗑</button></td></tr>`).join('')||'<tr><td colspan=5>No expenses</td></tr>'}</table></div>`;

let rp={f:today().slice(0,8)+'01',t:today()};
pages.reports=()=>`<h2>📈 Profit Reports</h2><div class="bar">From <input type="date" id="rf" value="${rp.f}" onchange="rp.f=this.value;drawReport()"> To <input type="date" id="rt" value="${rp.t}" onchange="rp.t=this.value;drawReport()">
<button class="btn sm x" onclick="rr(0)">Today</button><button class="btn sm x" onclick="rr(1)">This Month</button><button class="btn sm x" onclick="rr(2)">This Year</button><button class="btn sm o" onclick="window.print2()">🖨️ Print</button></div><div id="rep"></div>`;
init.reports=()=>drawReport();
function rr(k){const t=today();rp.t=t;rp.f=k===0?t:k===1?t.slice(0,8)+'01':t.slice(0,5)+'01-01';$('#rf').value=rp.f;$('#rt').value=rp.t;drawReport()}
function drawReport(){const c=calc(rp.f,rp.t);const top={};c.S.forEach(s=>s.items.forEach(i=>{top[i.name]=top[i.name]||{q:0,p:0};top[i.name].q+=i.qty;top[i.name].p+=(i.price-i.cost)*i.qty}));
 const T=Object.entries(top).sort((a,b)=>b[1].p-a[1].p).slice(0,10);
 $('#rep').innerHTML=`<div class="stats"><div class="stat"><small>Sales Revenue (${c.S.length} bills)</small><b>${fmt(c.sales)}</b></div><div class="stat g"><small>Sales Profit</small><b>${fmt(c.saleProfit)}</b></div>
 <div class="stat"><small>Repair Income (${c.R.length} jobs)</small><b>${fmt(c.repInc)}</b></div><div class="stat g"><small>Repair Profit</small><b>${fmt(c.repProfit)}</b></div>
 <div class="stat r"><small>Expenses</small><b>${fmt(c.exp)}</b></div><div class="stat ${c.net>=0?'g':'r'}"><small>NET PROFIT</small><b>${fmt(c.net)}</b></div></div>
 <div class="card tw"><h3>Summary</h3><table><tr><td>Sales Revenue</td><td>${fmt(c.sales)}</td></tr><tr><td>Cost of Goods Sold</td><td>- ${fmt(c.saleCost)}</td></tr><tr><td><b>Gross Sales Profit</b></td><td><b>${fmt(c.saleProfit)}</b></td></tr>
 <tr><td>Repair Income</td><td>${fmt(c.repInc)}</td></tr><tr><td>Repair Parts Cost</td><td>- ${fmt(c.repCost)}</td></tr><tr><td><b>Repair Profit</b></td><td><b>${fmt(c.repProfit)}</b></td></tr>
 <tr><td>Expenses</td><td>- ${fmt(c.exp)}</td></tr><tr><td><b>NET PROFIT</b></td><td><b>${fmt(c.net)}</b></td></tr></table></div>
 <div class="card tw"><h3>Top Products (by profit)</h3><table><tr><th>Product</th><th>Qty Sold</th><th>Profit</th></tr>${T.map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.q}</td><td>${fmt(x.p)}</td></tr>`).join('')||'<tr><td colspan=3>No data</td></tr>'}</table></div>`}
window.print2=()=>{$('#printArea').innerHTML=`<h2>${esc(db.settings.name)} - Profit Report (${rp.f} to ${rp.t})</h2>`+$('#rep').innerHTML;window.print()};
